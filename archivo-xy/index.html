<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARCHIVO X-Y</title><style>html,body{margin:0;background:#050b14;color:#fff;font-family:system-ui}#load{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.spin{width:52px;height:52px;border:4px solid #20364f;border-top-color:#72f0d0;border-radius:50%;animation:s 1s linear infinite;margin:auto}@keyframes s{to{transform:rotate(360deg)}}pre{white-space:pre-wrap;text-align:left;color:#ffd6de}</style></head><body><div id="load"><div><div class="spin"></div><p>Cargando ARCHIVO X-Y...</p><small>Verificando archivos de la actividad</small></div></div><script>(async()=>{try{const files=['p0.js','p1.js','p2.js','p3.js'];const texts=await Promise.all(files.map(f=>fetch(f+'?v=20261016b',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f+' no disponible (HTTP '+r.status+')');return r.text()})));const parts=texts.map((t,i)=>{const m=t.match(/\+\"([A-Za-z0-9+/=]+)\";?\s*$/);if(!m)throw new Error('Fragmento '+(i+1)+' inválido');return m[1]});const b64=parts.join('');if(b64.length!==35112)throw new Error('Longitud inesperada: '+b64.length+'; se esperaban 35112 caracteres');if(b64.length%4!==0)throw new Error('Base64 incompleto');const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const text=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();if(!text.includes('<title>ARCHIVO X–Y'))throw new Error('El contenido reconstruido no corresponde a ARCHIVO X-Y');document.open();document.write(text);document.close()}catch(e){document.body.innerHTML='<pre style="padding:24px">Error al cargar la actividad.\n'+e+'\n\nHaz Ctrl+F5 y vuelve a intentar.</pre>';console.error(e)}})();</script></body></html>
