<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARCHIVO X-Y</title><style>html,body{margin:0;background:#050b14;color:#fff;font-family:system-ui}#load{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.spin{width:52px;height:52px;border:4px solid #20364f;border-top-color:#72f0d0;border-radius:50%;animation:s 1s linear infinite;margin:auto}@keyframes s{to{transform:rotate(360deg)}}pre{white-space:pre-wrap;text-align:left;color:#ffd6de}</style></head><body><div id="load"><div><div class="spin"></div><p>Cargando ARCHIVO X-Y...</p><small>Reconstruyendo actividad</small></div></div><script>window.__AXY__='';</script><script src="p0.js?v=20261016e"></script><script src="p1.js?v=20261016e"></script><script src="p2.js?v=20261016e"></script><script src="p3.js?v=20261016e"></script><script>(async()=>{try{let b64=String(window.__AXY__||'').replace(/[^A-Za-z0-9+/=]/g,'');if(b64.length<35112)throw new Error('Datos incompletos: '+b64.length+'/35112');b64=b64.slice(0,35112);const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(!('DecompressionStream' in window))throw new Error('Usa Chrome o Edge actualizado.');const ds=new DecompressionStream('gzip');const text=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();if(!text.includes('ARCHIVO X'))throw new Error('Actividad inválida');document.open();document.write(text);document.close()}catch(e){document.body.innerHTML='<pre style="padding:24px">Error al cargar la actividad.\n'+e+'\n\nHaz Ctrl+F5 y vuelve a intentar.</pre>';console.error(e)}})();</script></body></html>
