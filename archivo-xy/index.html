<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARCHIVO X-Y</title><style>html,body{margin:0;background:#050b14;color:#fff;font-family:system-ui}#load{min-height:100vh;display:grid;place-items:center;text-align:center}.spin{width:52px;height:52px;border:4px solid #20364f;border-top-color:#72f0d0;border-radius:50%;animation:s 1s linear infinite;margin:auto}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div id="load"><div><div class="spin"></div><p>Cargando ARCHIVO X-Y...</p></div></div><script src="p0.js"></script><script src="p1.js"></script><script src="p2.js"></script><script src="p3.js"></script><script>(async()=>{try{const bin=Uint8Array.from(atob(window.__AXY__),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const text=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(text);document.close()}catch(e){document.body.innerHTML='<pre style="padding:24px">Error al cargar la actividad. Recarga con Ctrl+F5.\n'+e+'</pre>';console.error(e)}})();</script></body></html>
