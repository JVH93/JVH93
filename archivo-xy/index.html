<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ARCHIVO Xâ€“Y | Escape Room Cartesiano</title>
<style>
:root{
  --bg:#050b14;
  --panel:#0b1524;
  --panel2:#0f1d31;
  --text:#f2f7ff;
  --muted:#91a7bf;
  --accent:#72f0d0;
  --accent2:#77a8ff;
  --gold:#ffd166;
  --danger:#ff627d;
  --line:#263c56;
  --ok:#75f0c3;
  --shadow:0 30px 90px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{overflow-x:hidden}
button,input{font:inherit}
button{cursor:pointer}

#fx{
  position:fixed;inset:0;z-index:-4;width:100%;height:100%;
}
.bg-glow{
  position:fixed;inset:-20%;z-index:-5;
  background:
    radial-gradient(circle at 18% 20%,rgba(67,121,255,.16),transparent 25%),
    radial-gradient(circle at 85% 18%,rgba(114,240,208,.12),transparent 22%),
    radial-gradient(circle at 70% 85%,rgba(165,88,255,.10),transparent 26%),
    linear-gradient(#050b14,#07111f 55%,#050a12);
}
.scanlines{
  position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.06;
  background:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(255,255,255,.25) 4px);
  mix-blend-mode:overlay;
}
.vignette{
  position:fixed;inset:0;pointer-events:none;z-index:49;
  box-shadow:inset 0 0 150px rgba(0,0,0,.75)
}
.app{min-height:100vh}
.scene{
  min-height:100vh;
  display:none;
  align-items:center;
  justify-content:center;
  padding:28px;
  position:relative;
}
.scene.active{display:flex;animation:sceneIn .65s cubic-bezier(.2,.8,.2,1)}
@keyframes sceneIn{
  from{opacity:0;transform:translateY(16px) scale(.992);filter:blur(8px)}
  to{opacity:1;transform:none;filter:blur(0)}
}
.shell{width:min(1180px,95vw);margin:auto}
.micro{
  color:var(--accent);
  font-size:.74rem;
  font-weight:900;
  letter-spacing:.22em;
  text-transform:uppercase;
}
.display{
  font-size:clamp(3rem,9vw,7.4rem);
  line-height:.86;
  margin:.3rem 0 1rem;
  letter-spacing:-.055em;
}
.lead{
  color:#b7c7d9;
  font-size:clamp(1rem,2vw,1.28rem);
  max-width:820px;
  line-height:1.6
}
.hero{
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:50px;
  align-items:center;
}
.hero-visual{
  height:520px;
  position:relative;
  display:grid;
  place-items:center;
}
.orbit{
  position:absolute;border:1px solid rgba(114,240,208,.18);border-radius:50%;
  animation:spin 18s linear infinite;
}
.orbit.o1{width:420px;height:420px}
.orbit.o2{width:310px;height:310px;animation-direction:reverse;animation-duration:12s}
.orbit.o3{width:190px;height:190px;animation-duration:8s}
.orbit:before{
  content:"";position:absolute;left:50%;top:-5px;width:9px;height:9px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 24px var(--accent)
}
@keyframes spin{to{transform:rotate(360deg)}}
.axis{
  position:absolute;background:linear-gradient(90deg,transparent,rgba(119,168,255,.65),transparent)
}
.axis.x{width:480px;height:1px}
.axis.y{height:480px;width:1px;background:linear-gradient(transparent,rgba(119,168,255,.65),transparent)}
.core{
  width:110px;height:110px;border-radius:30px;transform:rotate(45deg);
  border:1px solid rgba(114,240,208,.55);
  background:linear-gradient(135deg,rgba(114,240,208,.12),rgba(119,168,255,.10));
  box-shadow:0 0 70px rgba(114,240,208,.18),inset 0 0 35px rgba(114,240,208,.10);
  animation:pulse 3s ease-in-out infinite
}
@keyframes pulse{50%{transform:rotate(45deg) scale(1.08);box-shadow:0 0 100px rgba(114,240,208,.28)}}

.btn{
  border:1px solid rgba(114,240,208,.5);
  background:linear-gradient(180deg,rgba(114,240,208,.16),rgba(114,240,208,.09));
  color:#eafff9;
  padding:14px 20px;
  border-radius:14px;
  font-weight:900;
  letter-spacing:.02em;
  transition:.25s;
  box-shadow:0 8px 30px rgba(0,0,0,.25)
}
.btn:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 10px 35px rgba(114,240,208,.13)}
.btn.secondary{
  border-color:#35506d;background:#0c1a2b;color:#cfe0f2
}
.btn.danger{
  border-color:#743044;background:#26111a;color:#ffc6d0
}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}

.hud{
  position:fixed;top:18px;left:18px;right:18px;z-index:30;
  display:none;justify-content:space-between;align-items:center;gap:16px;
  pointer-events:none
}
.hud.show{display:flex}
.hud-box{
  pointer-events:auto;
  background:rgba(7,16,29,.72);backdrop-filter:blur(14px);
  border:1px solid #243c58;border-radius:14px;padding:10px 13px;
  color:#bdd0e5;font-size:.86rem
}
.hud-progress{width:min(360px,38vw);height:7px;background:#101d30;border-radius:20px;overflow:hidden;border:1px solid #27425f}
.hud-progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:.45s}

.panel{
  background:linear-gradient(180deg,rgba(13,27,47,.93),rgba(7,16,29,.95));
  border:1px solid #253e5a;border-radius:24px;
  box-shadow:var(--shadow);
}
.hub-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:30px
}
.case{
  min-height:350px;padding:24px;position:relative;overflow:hidden;
  transition:.3s;display:flex;flex-direction:column;justify-content:space-between
}
.case.locked{opacity:.48;filter:saturate(.5)}
.case.available:hover{transform:translateY(-6px);border-color:#437197}
.case.done{border-color:#2e7a64;background:linear-gradient(180deg,rgba(18,58,49,.42),rgba(7,24,23,.92))}
.case-no{
  font-size:5rem;line-height:1;font-weight:1000;letter-spacing:-.07em;color:#24405e
}
.case.done .case-no{color:#276c5a}
.case-status{font-weight:900;color:#9eb4ca}
.case.available .case-status{color:var(--accent)}
.case.done .case-status{color:#9bf5d7}
.case-lock{
  position:absolute;right:20px;top:20px;width:38px;height:38px;border-radius:12px;
  display:grid;place-items:center;background:#101d2e;border:1px solid #2f4965;color:#7890aa
}
.case.available .case-lock{color:var(--accent);border-color:#356c61}
.case.done .case-lock{color:#9bf5d7}
.case-line{height:1px;background:linear-gradient(90deg,#2b4562,transparent);margin:14px 0}
.case p{color:#91a5ba;line-height:1.5}

.challenge-wrap{
  display:grid;grid-template-columns:1.28fr .72fr;gap:18px;align-items:stretch
}
.challenge-main{padding:30px;min-height:600px;display:flex;flex-direction:column}
.challenge-side{padding:22px;min-height:600px}
.step-tag{
  display:inline-flex;align-items:center;gap:8px;width:max-content;
  padding:7px 10px;border-radius:999px;background:#0c2130;border:1px solid #2d5662;
  color:#b7efe1;font-size:.78rem;font-weight:900;letter-spacing:.09em;text-transform:uppercase
}
.problem{
  flex:1;display:flex;flex-direction:column;justify-content:center;max-width:850px
}
.problem h2{font-size:clamp(2rem,4.4vw,4.2rem);line-height:1.04;margin:18px 0;color:#f4f8fd;letter-spacing:-.035em}
.problem .math{
  margin:16px 0 0;padding:18px 20px;border-radius:18px;
  background:#081423;border:1px solid #294663;
  font-size:clamp(1.3rem,3vw,2.4rem);font-weight:800;color:#ddecff;
  box-shadow:inset 0 0 40px rgba(119,168,255,.03)
}
.answer-row{margin-top:22px;display:flex;gap:12px;align-items:end}
.input-wrap{flex:1}
label{display:block;color:#a9bdd2;font-size:.82rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
input{
  width:100%;margin-top:7px;background:#071321;border:1px solid #34526e;color:#fff;
  padding:14px 15px;border-radius:13px;outline:none;font-size:1rem
