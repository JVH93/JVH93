<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARCHIVO X-Y</title><style>html,body{margin:0;background:#050b14;color:#fff;font-family:system-ui}#load{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.spin{width:52px;height:52px;border:4px solid #20364f;border-top-color:#72f0d0;border-radius:50%;animation:s 1s linear infinite;margin:auto}@keyframes s{to{transform:rotate(360deg)}}pre{white-space:pre-wrap;text-align:left;color:#ffd6de}</style></head><body><div id="load"><div><div class="spin"></div><p>Cargando ARCHIVO X-Y...</p><small>Versión limpia</small></div></div><script>window.__AXY__='';</script><script src="../archivo-xy/p0.js?v=v2-2"></script><script src="../archivo-xy/p1.js?v=v2-2"></script><script src="../archivo-xy/p2.js?v=v2-2"></script><script src="../archivo-xy/p3.js?v=v2-2"></script><script>(async()=>{try{let b64=String(window.__AXY__||'').replace(/[^A-Za-z0-9+/=]/g,'');if(b64.length!==35112)throw new Error('Longitud inesperada: '+b64.length+'/35112');const raw=atob(b64);const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));if(!('DecompressionStream' in window))throw new Error('Navegador sin soporte de descompresión');const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();if(!html.includes('ARCHIVO X'))throw new Error('Contenido reconstruido inválido');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<pre style="padding:24px">ERROR V2\n'+e+'</pre>';console.error(e)}})();</script></body></html>
